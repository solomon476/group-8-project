<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2>Dashboard</h2>
            <div>
                <a href="index.html" class="btn-secondary"
                    style="border-color: var(--error-color); color: var(--error-color);">Logout</a>
            </div>
        </div>

        <div style="margin-bottom: 2rem;">
            <h3 style="margin-top: 0;">Welcome, Student!</h3>
            <p style="color: var(--text-secondary);">Here is your profile information.</p>
        </div>

        <div style="background: var(--bg-color); padding: 1.5rem; border-radius: 0.5rem;">
            <div style="margin-bottom: 1rem;">
                <strong>Username:</strong> Student
            </div>
            <div style="margin-bottom: 1rem;">
                <strong>Email Address:</strong> studentS@example.com
            </div>
            <div>
                <strong>Member Since:</strong> March 4, 2026
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
