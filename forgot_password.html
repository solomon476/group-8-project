<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-container">
        <h2>Reset Password</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem;">Enter your email to receive
            a password reset link.</p>

        <form action="reset_password.html" method="GET">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required>
            </div>

            <button type="submit" class="submit-btn"
                onclick="alert('Demo: A simulated reset link has been sent to your email.'); return true;">Send Reset
                Link</button>
        </form>

        <div class="links" style="margin-top: 1.5rem; text-align: center;">
            <a href="index.html">Back to Login</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
